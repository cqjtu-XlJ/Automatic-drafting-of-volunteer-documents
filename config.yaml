# LLM 配置文件
# 注意：API Key 不要存储在此文件中，请通过前端界面输入

llm:
  # 是否启用 LLM 生成内容（true/false）
  enabled: true

  # AI 提供商选择：zhipu / deepseek / qwen / moonshot / mimo / doubao
  provider: zhipu

  # 智谱AI 配置
  zhipu:
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    model: "glm-4-flash"
    max_tokens: 1500
    temperature: 0.7

  # DeepSeek 配置
  deepseek:
    base_url: "https://api.deepseek.com"
    model: "deepseek-chat"
    max_tokens: 1500
    temperature: 0.7

  # 通义千问配置
  qwen:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-turbo"
    max_tokens: 1500
    temperature: 0.7

  # 月之暗面（Kimi）配置
  moonshot:
    base_url: "https://api.moonshot.cn/v1"
    model: "moonshot-v1-8k"
    max_tokens: 1500
    temperature: 0.7

  # 小米 MIMO 配置
  mimo:
    base_url: "https://token-plan-cn.xiaomimimo.com/anthropic"
    model: "mimo-chat"
    max_tokens: 1500
    temperature: 0.7

  # 火山引擎 Doubao 配置
  doubao:
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    model: "doubao-seed"
    max_tokens: 1500
    temperature: 0.7

  # 请求超时时间（秒）
  timeout: 30
